<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Sky Palette</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(ellipse 90% 50% at 50% 110%, #943440 0%, transparent 60%), #090b10;
        color: #f8fafc;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 26rem; }
      p.code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 0.75rem; letter-spacing: 0.2em; color: #fca5a5; margin: 0 0 1rem; }
      h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 0.75rem; }
      p.copy { color: #cbd5e1; font-size: 0.95rem; line-height: 1.6; margin: 0 0 1.5rem; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 1.5rem;
        border-radius: 9999px;
        background: #f8fafc;
        color: #090b10;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #fca5a5; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · LOST IN THE CLOUDS</p>
      <h1>That page drifted away.</h1>
      <p class="copy">The link is broken or the sky has moved on. Head back to the live palette.</p>
      <a href="/">Back to the sky</a>
    </main>
  </body>
</html>
