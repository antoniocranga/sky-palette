name: Feature Request
description: Suggest an idea, enhancement, or astronomical calculation feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome design suggestions, physical model improvements, and new features!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I am always frustrated when...
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
  - type: checkboxes
    id: guidelines
    attributes:
      label: Design Guidelines Verification
      description: Sky Palette adheres to an unslopped, high-contrast, zero-tracking aesthetic.
      options:
        - label: This feature maintains 100% cookie-free, privacy-preserving zero-tracking.
          required: true
        - label: This feature respects zero-bloat, high-performance edge execution.
          required: true
