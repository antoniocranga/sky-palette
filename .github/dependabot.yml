version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      testing:
        patterns:
          - "vitest"
          - "@playwright/*"
          - "@axe-core/*"
    ignore:
      # Major framework jumps are handled deliberately, not automatically.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
